      label: 주요 범위
      placeholder: "이 기능에 포함되는 개발 범위"
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      placeholder: "기능 전체가 완료되었다고 판단할 조건"
    validations:
      required: true
